[project]
name = "finalproject-iskornev-m26-555"
version = "0.1.0"
description = "ValutaTrade Hub — консольная платформа для торговли и отслеживания валютных курсов"
readme = "README.md"
authors = [
    { name = "Искорнев Иван", email = "iskornev.ivan@bk.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
project = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
